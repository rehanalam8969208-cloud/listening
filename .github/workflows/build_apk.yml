name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Generate Android Code
        run: flutter create . --platforms=android --org=com.rehan.listening

      - name: Surgical Injection Script (Fixes V2 Embedding & Multidex)
        run: |
          cat << 'EOF' > setup.dart
          import 'dart:io';
          void main() {
            // 1. Safely modify Gradle for SDKs without breaking it
            var gradle = File('android/app/build.gradle');
            var g = gradle.readAsStringSync();
            g = g.replaceAll('flutter.minSdkVersion', '21');
            g = g.replaceAll('flutter.compileSdkVersion', '34');
            g = g.replaceAll('flutter.targetSdkVersion', '34');
            g = g.replaceFirst('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true');
            gradle.writeAsStringSync(g);

            // 2. Surgically patch original Manifest without destroying V2 Embedding
            var manifest = File('android/app/src/main/AndroidManifest.xml');
            var m = manifest.readAsStringSync();
            
            // Insert Permissions
            String perms = '<uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <application';
            m = m.replaceFirst('<application', perms);
            
            // Change Activity to support Background Audio
            m = m.replaceFirst('android:name=".MainActivity"', 'android:name="com.ryanheise.audioservice.AudioServiceActivity"');
            
            // Insert Audio Services
            String services = '<service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true"><intent-filter> <action android:name="android.media.browse.MediaBrowserService" /> </intent-filter></service>\n        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true"><intent-filter> <action android:name="android.intent.action.MEDIA_BUTTON" /> </intent-filter></receiver>\n    </application>';
            m = m.replaceFirst('</application>', services);
            
            manifest.writeAsStringSync(m);
            print('SUCCESS: Surgical Injection Completed!');
          }
          EOF
          dart setup.dart

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Listening-Premium-App
          path: 'build/app/outputs/**/*.apk'
